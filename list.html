<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8">

    <title>文章列表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#33cccc">

    <link rel="stylesheet" href="css/mui.min.css">
    <link rel="stylesheet" href="css/mystyle.css" />
  </head>

  <body>
    <div id="content">
      <!--下拉刷新容器-->
      <div id="pullrefresh" class="mui-content mui-scroll-wrapper">
        <div class="mui-scroll">
          <!--骨架屏：首屏与下拉刷新时占位，避免纯白屏-->
          <ul class="mui-table-view skeleton-list" v-if="loading">
            <li class="mui-table-view-cell mui-media skeleton-item" v-for="n in 6" :key="'sk' + n">
              <span class="skeleton-thumb"></span>
              <div class="skeleton-lines">
                <span class="skeleton-line w80"></span>
                <span class="skeleton-line w55"></span>
              </div>
            </li>
          </ul>
          <!--数据列表-->
          <ul class="mui-table-view" v-if="imglist.length">
            <my-img-list v-for="item in imglist" :id="item.id" :date="item.date" :author="item.author" :title="item.title.rendered" :excerpt="item.excerpt.rendered" :featured_image_src="item.featured_image_src" :key="item.id">
            </my-img-list>
          </ul>
          <!--空态 / 错误态-->
          <div class="list-empty" v-if="!loading && !imglist.length">
            <p class="list-empty-text">{{errorState ? '加载失败了，检查下网络连接' : '这里还没有内容'}}</p>
            <a class="list-empty-btn" v-on:click="retry" v-if="errorState">重新加载</a>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/mui.min.js"></script>
    <script type="text/javascript" src="js/vue.min.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script>
      var wp = new WP();
      var LIST_CACHE_PREFIX = 'list:';

      /* 剥标签取纯文本：用 DOMParser 解析，不插入文档，杜绝副作用 */
      function toPlainText(html) {
        if(!html) return '';
        try {
          var doc = new DOMParser().parseFromString(String(html), 'text/html');
          return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
        } catch (e) {
          return String(html).replace(/<[^>]*>/g, '');
        }
      }

      /*
       * 列表只渲染纯文本：标题解码实体、摘要截断。
       * WP 的 excerpt.rendered 自带 <p>，塞进 <p class="mui-ellipsis"> 属非法嵌套，会撑破省略号样式。
       */
      var EXCERPT_MAX = 80;
      function normalizePosts(data) {
        return (data || []).map(function(item) {
          if(item.title) item.title.rendered = toPlainText(item.title.rendered);
          var text = toPlainText(item.excerpt && item.excerpt.rendered);
          if(text.length > EXCERPT_MAX) text = text.slice(0, EXCERPT_MAX) + '…';
          if(!item.excerpt) item.excerpt = {};
          item.excerpt.rendered = text;
          return item;
        });
      }

      /* 按文章 id 去重，避免分页边界重复渲染同一篇 */
      function mergeUnique(oldList, newList) {
        var seen = {};
        var out = [];
        var i;
        for(i = 0; i < oldList.length; i++) {
          if(!seen[oldList[i].id]) {
            seen[oldList[i].id] = 1;
            out.push(oldList[i]);
          }
        }
        for(i = 0; i < newList.length; i++) {
          if(!seen[newList[i].id]) {
            seen[newList[i].id] = 1;
            out.push(newList[i]);
          }
        }
        return out;
      }

      /*
       * VUE
       */
      var list = new Vue({
          el: '#content',
          data: {
            imglist: [],
            page: 1, // 已成功加载的页码
            hasMore: true,
            loading: true,
            errorState: false,
            /* 筛选条件：categories / tags / search / user，切换来源时整组重置 */
            query: {
              context: 'embed'
            },
            firstLoad: true
          },
          computed: {
            /* 缓存键必须带上筛选条件，否则重启后会看到上次筛选的结果 */
            cacheKey: function() {
              return LIST_CACHE_PREFIX + util.paramString(this.query);
            }
          },
          methods: {
            /* 组装请求参数，页码由调用方传入，不再依赖 computed 副作用 */
            buildParams: function(page) {
              var params = {};
              for(var k in this.query) {
                if(Object.prototype.hasOwnProperty.call(this.query, k)) params[k] = this.query[k];
              }
              params.page = page;
              return params;
            },
            /* 恢复首页缓存，命中则免去首屏网络等待 */
            restoreCache: function() {
              var cached = util.getCache(this.cacheKey);
              if(cached && cached.length) {
                this.imglist = cached;
                this.page = 1;
                this.hasMore = cached.length >= app.per_page;
                this.loading = false;
                return true;
              }
              return false;
            },
            /* 首屏加载：只做同步读缓存，网络请求统一交给 plusReady 后的 pulldownLoading，
               避免首屏同时发两条相同的第一页请求 */
            firstLoadList: function() {
              this.restoreCache();
            },
            /* 第一页加载，showSkeleton 控制是否展示骨架屏 */
            loadFirstPage: function(showSkeleton) {
              var self = this;
              if(showSkeleton) this.loading = true;
              this.errorState = false;
              wp.getData({
                route: 'posts',
                data: this.buildParams(1),
                success: function(data) {
                  var posts = normalizePosts(data);
                  self.imglist = posts;
                  self.page = 1;
                  self.hasMore = posts.length >= app.per_page;
                  self.loading = false;
                  self.errorState = false;
                  util.setCache(self.cacheKey, posts);
                  mui('#pullrefresh').pullRefresh().refresh(true);
                  mui('#pullrefresh').pullRefresh().endPulldownToRefresh();
                },
                error: function() {
                  self.loading = false;
                  self.errorState = true;
                  mui('#pullrefresh').pullRefresh().endPulldownToRefresh();
                  if(self.imglist.length) mui.toast('刷新失败，先把上次的内容给你');
                }
              })
            },
            retry: function() {
              this.loadFirstPage(true);
            },
            pullupRefresh: function() {
              if(!list.hasMore) {
                mui('#pullrefresh').pullRefresh().endPullupToRefresh(true);
                return;
              }
              wp.getData({
                route: 'posts',
                data: list.buildParams(list.page + 1),
                success: function(data) {
                  var posts = normalizePosts(data);
                  if(posts.length) list.page++;
                  list.imglist = mergeUnique(list.imglist, posts);
                  list.hasMore = posts.length >= app.per_page;
                  list.errorState = false;
                  mui('#pullrefresh').pullRefresh().endPullupToRefresh(!list.hasMore);
                },
                error: function() {
                  mui('#pullrefresh').pullRefresh().endPullupToRefresh(false);
                  mui.toast('加载失败，请检查网络');
                }
              })
            },
            pulldownRefresh: function() {
              // 下拉刷新：整组缓存失效，回到第一页
              util.clearCacheByPrefix(LIST_CACHE_PREFIX);
              list.hasMore = true;
              wp.getData({
                route: 'posts',
                data: list.buildParams(1),
                success: function(data) {
                  var posts = normalizePosts(data);
                  list.imglist = posts;
                  list.page = 1;
                  list.hasMore = posts.length >= app.per_page;
                  list.errorState = false;
                  util.setCache(list.cacheKey, posts);
                  mui('#pullrefresh').pullRefresh().refresh(true);
                  mui('#pullrefresh').pullRefresh().endPulldownToRefresh();
                },
                error: function() {
                  mui('#pullrefresh').pullRefresh().endPulldownToRefresh();
                  mui.toast('好像出错了哦~');
                }
              })
            }
          },
          components: {
            'my-img-list': MyImgList
          }
        })

      mui.init({
        preloadPages: [{
          url: 'detail.html',
          id: 'detail.html'
        }],
        pullRefresh: {
          container: '#pullrefresh',
          down: {
            callback: list.pulldownRefresh
          },
          up: {
            contentrefresh: '正在加载...',
            contentnomore: '没有更多了',
            callback: list.pullupRefresh
          }
        }
      });
      /*
       * 监听点击事件
       */
      mui(".mui-table-view").on('tap', '.mui-table-view-cell', function() {
        //获取id
        var id = this.getAttribute("data-id");
        var author = this.getAttribute("data-author");
        if(!id) return;
        var detail_page = plus.webview.getWebviewById('detail.html');
        mui.fire(detail_page, 'getDetail', {
          id: id,
          author: author
        });
        //打开新闻详情
        mui.openWindow({
          id: 'detail.html',
        }); //打开新闻详情
      })
      mui.plusReady(function() {
        var main = plus.webview.getLaunchWebview();
        var listpage = plus.webview.getWebviewById('list.html');
        listpage.addEventListener('maskClick', closeMenu);
        var isInTransition = false;
        var showMenu = false;
        /**
         * 显示侧滑菜单
         */
        function openMenu() {
          if(isInTransition) {
            return;
          }
          if(!showMenu) {
            mui.fire(main, 'menu:open');
            //侧滑菜单处于隐藏状态，则立即显示出来；
            isInTransition = true;
            main.setStyle({
              mask: 'rgba(0,0,0,0)'
            }); //menu设置透明遮罩防止点击
            //主窗体开始侧滑并显示遮罩
            listpage.setStyle({
              mask: 'rgba(0,0,0,0)',
              left: '40%',
              transition: {
                duration: 150
              }
            });
            mui.later(function() {
              isInTransition = false;
              main.setStyle({
                mask: "none"
              }); //移除menu的mask
              listpage.setStyle({
                mask: 'rgba(0,0,0,0.4)'
              })
            }, 160);
            showMenu = true;
          }
        };
        /**
         * 关闭菜单
         */
        function closeMenu() {
          if(isInTransition) {
            return;
          }
          if(showMenu) {
            mui.fire(main, 'menu:close');
            //关闭遮罩；主窗体开始侧滑；
            isInTransition = true;
            listpage.setStyle({
              mask: 'none',
              left: '0',
              transition: {
                duration: 200
              }
            });
            showMenu = false;
            isInTransition = false;
          }
        };
        //处理逻辑：1秒内，连续两次按返回键，则后台运行应用；
        //处理逻辑：1秒内，连续两次按返回键，则退出应用；
        var first = null;
        mui.back = function() {
          if(showMenu) {
            closeMenu();
          } else {
            //首次按键，提示‘再按一次退出应用’
            if(!first) {
              first = new Date().getTime();
              mui.toast('再按一次退出应用');
              setTimeout(function() {
                first = null;
              }, 1000);
            } else {
              if(new Date().getTime() - first < 1000) {
                plus.runtime.quit();
              }
            }
          }
        };
        //主界面向右滑动，若菜单未显示，则显示菜单；否则不做任何操作
//      window.addEventListener("swiperight", openMenu);
        //主界面向左滑动，若菜单已显示，则关闭菜单；否则，不做任何操作；
        window.addEventListener("swipeleft", closeMenu);
        //侧滑菜单触发关闭菜单命令
        window.addEventListener("menu:close", closeMenu);
        window.addEventListener("menu:open", openMenu);
        window.addEventListener("menu", function() {
          if(showMenu) {
            closeMenu();
          } else {
            openMenu();
          }
        });
        window.addEventListener('reload', function(event) {
          var detail = event.detail || {};
          var query = {
            context: detail.context || 'embed'
          };
          // 只接管真正的筛选字段，page 由列表自己控制
          if(detail.categories !== undefined && detail.categories !== '') query.categories = detail.categories;
          if(detail.tags !== undefined && detail.tags !== '') query.tags = detail.tags;
          if(detail.search !== undefined && detail.search !== '') query.search = detail.search;
          if(detail.user !== undefined && detail.user !== '') query.user = detail.user;
          list.query = query;
          list.hasMore = true;
          list.imglist = [];
          list.loading = true;
          list.errorState = false;
          util.resetScroll('.mui-scroll-wrapper');
          closeMenu();
          mui('#pullrefresh').pullRefresh().pulldownLoading();
        })
      })
      /* 首次进入先用缓存兜底，有缓存直接出内容，避免骨架屏空转 */
      list.firstLoadList();
      if(window.plus) {
        mui.plusReady(function() {
          mui('#pullrefresh').pullRefresh().pulldownLoading();
        });
      } else {
        /* 浏览器里没有 plus，直接请求，否则会一直停在骨架屏 */
        list.loadFirstPage(true);
      }
    </script>
  </body>

</html>
