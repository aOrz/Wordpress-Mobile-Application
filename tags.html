<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<title>标签搜索</title>
		<link href="css/mui.min.css" rel="stylesheet" />
		<link rel="stylesheet" href="css/mystyle.css" />
		<style>
			.hot a {
				display: inline-block;
				margin: 3px 10px;
			}
		</style>
	</head>

	<body>
		<div id="content_tags">
			<my-header title="搜索" lefticon="mui-action-back mui-icon-back"></my-header>
			<div class="mui-content">
				<div class="mui-content-append">
					<h5>搜索</h5>
					<div class="mui-input-row mui-search">
						<input type="search" id="search" class="mui-input-clear" placeholder="关键词搜索">
					</div>
				</div>
				<h5> 热门标签</h5>
				<div class="hot">
					<a v-for="(item,index) in hot_tags" 
						:data-id="item.id" 
						:data-name="item.name" 
						v-on:click="tagspage" 
						:key="item.id">
						<span :data-name = "item.name" 
							:data-id = "item.id" 
							class="mui-badge" 
							:class="style[index % style.length]">{{item.name}}</span>
					</a>
				</div>
				<p class="tags-empty" v-if="loaded && !hot_tags.length">暂无热门标签</p>
			</div>
		</div>
		<script src="js/mui.min.js"></script>
		<script type="text/javascript" src="js/vue.min.js"></script>
		<script type="text/javascript" src="js/app.js"></script>
		<script>
			mui.init();
			var wp = new WP();
			var TAGS_CACHE_KEY = 'tags';
			var tags = new Vue({
				el: '#content_tags',
				data: {
					hot_tags: util.getCache(TAGS_CACHE_KEY) || [],
					loaded: false,
					style: ['', 'mui-badge-primary', 'mui-badge-success', 'mui-badge-warning', 'mui-badge-danger', 'mui-badge-purple']
				},
				methods: {
					getTags: function() {
						// 缓存新鲜就不打网络，避免每次进搜索页都重复请求
						if(tags.hot_tags.length && util.isFresh(TAGS_CACHE_KEY)) {
							tags.loaded = true;
							return;
						}
						wp.getData({
							route: 'tags',
							data: {
								orderby: 'count',
								order: 'desc',
								per_page: 50
							},
							success: function(data) {
								var list = data || [];
								util.setCache(TAGS_CACHE_KEY, list);
								// 整表替换而不是追加，避免与缓存数据重复渲染
								tags.$data.hot_tags = list;
								tags.loaded = true;
							},
							error: function() {
								tags.loaded = true;
								if(!tags.hot_tags.length) mui.toast('标签加载失败，请检查网络');
							}
						});
					},
					tagspage: function(event) {
						var id = event.target.dataset.id;
						var name = event.target.dataset.name;
						var index = plus.webview.getLaunchWebview();
						mui.fire(index, 'title', {
								title_name: name
							})
							//						console.log(id)
						var list = plus.webview.getWebviewById('list.html');
						mui.fire(list, 'reload', {
							page: 1,
							context: 'embed',
							tags: id,
						});
						mui.back()
					}
				}
			});
			tags.getTags();
			var search = document.getElementById('search');
			var composing = false; // 中文输入法组合状态，避免选词回车被当成搜索
			function doSearch() {
				var searchcont = (search.value || '').trim();
				if(!searchcont) return;
				var index = plus.webview.getLaunchWebview();
				mui.fire(index, 'title', {
					title_name: searchcont
				})
				var list = plus.webview.getWebviewById('list.html');
				mui.fire(list, 'reload', {
					page: 1,
					context: 'embed',
					search: searchcont,
				});
				mui.back()
			}
			search.addEventListener('compositionstart', function() {
				composing = true;
			});
			search.addEventListener('compositionend', function() {
				composing = false;
			});
			search.addEventListener('keydown', function(event) {
				if(event.keyCode == 13 && !composing) {
					event.preventDefault();
					doSearch();
				}
			})
			/* 部分输入法只派发 search 事件，不派发回车 */
			search.addEventListener('search', function() {
				if(!composing) doSearch();
			})
		</script>
	</body>

</html>
