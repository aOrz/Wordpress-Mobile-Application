<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
    <title>文章详情</title>

    <link href="css/mui.min.css" rel="stylesheet" />
    <link href="./css/prism.css" rel="stylesheet">
    <link rel="stylesheet" href="css/mystyle.css" />

    <style>
      h1 {
        font-size: 24px;
      }
      
      h2 {
        font-size: 21px;
      }
      
      h3 {
        font-size: 19px;
      }
      
      h4 {
        font-size: 17px;
      }
      
      h5 {
        font-size: 15px;
      }
      
      p {
        color: #000;
      }
      
      .title {
        padding: 10px 0;
        /*border-bottom:1px solid #BBBBBB;*/
      }
      
      .page-content {
        display: block;
        font-family: 'Helvetica Neue', Helvetica, 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        font-size: 16px;
        line-height: 25.6px;
        margin: 0px;
        padding: 0 10px 10px 10px;
        word-wrap: break-word;
      }
      
      img {
        max-width: 100%;
        height: auto;
      }
      
      .aligncenter {
        display: block;
        margin: 0 auto 10px;
      }
      
      .alignleft {
        display: block;
        margin: 0 0 10px auto;
      }
      
      body,
      #content {
        background-color: var(--bg, white);
      }
      .title h1{
      	line-height: 1.3;
      }
      .time {
        margin-bottom: 6px;
      }
      
      .time time {
        color: #BBBBBB;
      }
    </style>
  </head>

  <body>
    <div id="detail">
      <my-header title="文章详情" 
      	righticon="mui-icon-pengyouquan" 
      	lefticon="mui-action-back mui-icon-left-nav"></my-header>
      <div id="content" class="mui-content page-content mui-scroll">
        <div class="spinner" v-if="loading">
          <div class="bounce1"></div>
          <div class="bounce2"></div>
          <div class="bounce3"></div>
        </div>
        <div class="title">
          <h1 v-html="title"></h1>
        </div>
        <div class="time" v-if="!loading">
          <time>{{time}}</time>&nbsp;&nbsp;
          <a v-on:click="authorpage"
          	:data-id="author_id"
          	:data-name="author">{{author}}</a>
        </div>
        <div >
        	<div v-html="content" id="article-body">
        		
        	</div>
        </div>
        <div class="hot" v-if="tags && tags.length && !loading">
          <div class="title">
            <h5>标签</h5>
          </div>
          <a v-for="(item,index) in tags" :data-id="item.id" :data-name="item.name" v-on:click="tagspage" :key="item.id">
            <span :data-name="item.name" 
            	:data-id="item.id"
            	:class="tagClass(index)">{{item.name}}</span>
          </a>
        </div>
      </div>
    </div>
    <script src="js/mui.min.js"></script>
    <script type="text/javascript" src="js/vue.min.js"></script>
    <script src="js/prism.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script type="text/javascript" charset="UTF-8">
      mui.init();
      var artical = '';
      var DETAIL_CACHE_PREFIX = 'detail:';
      /* 标签配色按索引固定，避免每次渲染随机变色导致闪烁 */
      var TAG_STYLES = ['', 'mui-badge-primary', 'mui-badge-success', 'mui-badge-warning', 'mui-badge-danger', 'mui-badge-purple'];
      var detailVm = new Vue({
        el: '#detail',
        data: {
          title: '',
          content: '',
          time: '',
          author: '',
          tags: [],
          url: '',
          author_id:'',
          loading: 1
        },
        methods: {
          tagClass: function(index) {
            return 'mui-badge' + (TAG_STYLES[index % TAG_STYLES.length] || '');
          },
          tagspage: function(event) {
            var id = event.target.dataset.id;
            var name = event.target.dataset.name;
            var index = plus.webview.getLaunchWebview();
            mui.fire(index, 'title', {
                title_name: name
              })
              //						console.log(id)
            var list = plus.webview.getWebviewById('list.html');
            mui.fire(list, 'reload', {
              page: 1,
              context: 'embed',
              tags: id,
            });
            mui.back()
          },
          authorpage: function(event) {
            var id = event.target.dataset.id;
            var name = event.target.dataset.name;
            var index = plus.webview.getLaunchWebview();
            mui.fire(index, 'title', {
                title_name: name
              })
              //						console.log(id)
            var list = plus.webview.getWebviewById('list.html');
            mui.fire(list, 'reload', {
              page: 1,
              context: 'embed',
              user: id,
            });
            mui.back()
          }
        }
      })
      var wp = new WP();

      /* HTML 转纯文本，用于 document.title */
      function plainText(html) {
        if(!html) return '';
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
      }

      /* 统一渲染入口：缓存与网络两条路径共用，避免逻辑分叉 */
      function renderArticle(data) {
        if(!data || !data.id) return;
        detailVm.title = util.sanitize(data.title && data.title.rendered);
        detailVm.content = util.sanitize(data.content && data.content.rendered);
        detailVm.time = util.formatDate(data.date);
        if(data.link) detailVm.url = data.link;
        detailVm.loading = 0;
        document.title = plainText(detailVm.title).slice(0, 20) || '文章详情';
        Vue.nextTick(function() {
          if(window.Prism) Prism.highlightAll();
        })
      }

      window.addEventListener('getDetail', function(event) {
        var detail = event.detail || {};
        var id = detail.id;
        if(!id) return;
        if(artical === id) {
          return; // 同一篇直接复用已渲染内容
        }
        artical = id;
        util.resetScroll('#content'); // 换文章回到顶部，不停在上次的阅读位置
        detailVm.loading = 1;
        detailVm.tags = [];
        detailVm.author = '';
        detailVm.author_id = '';

        // 先吃本地缓存秒开，再静默拉最新
        var cached = util.getCache(DETAIL_CACHE_PREFIX + id);
        if(cached) renderArticle(cached);

        wp.getData({
          route: 'posts/' + id,
          data: {},
          success: function(data) {
            util.setCache(DETAIL_CACHE_PREFIX + id, data);
            renderArticle(data);
          },
          error: function() {
            // 有缓存就继续展示缓存，不弹窗打扰
            if(!cached) {
              detailVm.loading = 0;
              mui.alert('文章找不到了~');
            }
          }
        })
        if(detail.author) {
          wp.getData({
            route: 'users/' + detail.author,
            data: {},
            success: function(data) {
              detailVm.author = data.name;
              detailVm.author_id = data.id;
            },
            error: function() {}
          })
        }
        wp.getData({
          route: 'tags/',
          data: {
            post: id
          },
          success: function(data) {
            detailVm.tags = data;
          },
          error: function() {}
        })
      });
      /* 正文图片点击全屏预览（事件委托，v-html 更新后无需重绑） */
      util.bindImagePreview(document.getElementById('article-body'));
      mui('body').on('tap', 'a', function(e) {
        var url = this.getAttribute("href");
        // 只拦截 http(s) 外链，避免 javascript:/相对路径被误处理
        if(url && /^https?:\/\//i.test(url)) {
          localStorage.setItem('newurl', url)
          mui.openWindow({
            url: 'browser/index.html',
          })
        }
      });
      document.getElementById('righticon').addEventListener('tap', function() {
        if(detailVm.loading || !detailVm.title) {
          mui.toast('文章还没加载好，稍等一下');
          return;
        }
        // 标题是富文本，分享前必须转纯文本，否则会带出 <p> 之类的标签
        var text = plainText(detailVm.title);
        if(detailVm.url) text += ' ' + detailVm.url;
        shareSystem(text);
      })
      mui.plusReady(function() {
        // 更新系统分享服务列表（Android / iOS 通用）
        updateSerivces();
      })
    </script>
  </body>

</html>
